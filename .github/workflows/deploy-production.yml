
name: Deploy OttAid Landing Page - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ottaid-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vite application
      - name: Build Vite application
        env:
          CI: "true"
        run: npm run build

      # 5. Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsProduction

      # 6. Upload versioned Vite assets
      - name: Upload versioned assets to S3
        run: |
          aws s3 sync dist/assets/ \
            s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public,max-age=31536000,immutable"

      # 7. Upload remaining website files
      - name: Upload remaining files to S3
        run: |
          aws s3 sync dist/ \
            s3://${{ vars.S3_BUCKET }}/ \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      # 8. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # 9. Deployment summary
      - name: Deployment summary
        run: |
          echo "### OttAid Production Deployment" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "S3 Bucket: ${{ vars.S3_BUCKET }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "AWS Region: ${{ vars.AWS_REGION }}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Deployment completed successfully." \
            >> "$GITHUB_STEP_SUMMARY"
