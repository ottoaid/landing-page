
name: Deploy OttAid Landing Page - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ottaid-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        env:
          CI: "true"
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsProduction

      - name: Upload versioned assets to S3
        run: |
          aws s3 sync dist/assets/ \
            s3://${{ vars.S3_BUCKET }}/assets/ \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload remaining files to S3
        run: |
          aws s3 sync dist/ \
            s3://${{ vars.S3_BUCKET }}/ \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Production deployment complete" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Bucket: ${{ vars.S3_BUCKET }}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Region: ${{ vars.AWS_REGION }}" \
            >> "$GITHUB_STEP_SUMMARY"
